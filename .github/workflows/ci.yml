name: CI
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install uv
        run: python -m pip install uv
      - name: Install backend dependencies
        run: uv sync --project backend --frozen
      - name: Lint and test backend
        run: |
          backend/.venv/bin/ruff check backend
          cd backend && .venv/bin/pytest
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Typecheck, test, and build frontend
        run: npm run typecheck && npm test && npm run build
        working-directory: frontend
      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Migrate isolated end-to-end database
        run: |
          mkdir -p /tmp/sat-sa-ci
          cd backend && .venv/bin/alembic upgrade head
        env:
          DATABASE_URL: sqlite:////tmp/sat-sa-ci/app.db
      - name: Run real browser workflow
        run: npm run test:e2e
        working-directory: frontend
        env:
          DATABASE_URL: sqlite:////tmp/sat-sa-ci/app.db
      - name: Build and start packaged application
        run: |
          docker compose build
          docker compose up --no-build --pull never -d
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:18000/ready; then exit 0; fi
            sleep 2
          done
          docker compose logs app
          exit 1
        env:
          HOST_PORT: '18000'
          ALLOWED_ORIGINS: http://127.0.0.1:18000
      - name: Run browser workflow against packaged application
        run: npm run test:e2e
        working-directory: frontend
        env:
          CI: ''
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:18000
      - name: Show packaged application logs on failure
        if: failure()
        run: docker compose logs app
