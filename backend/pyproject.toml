[project]
name = "sat-sa"
version = "0.1.0"
description = "Evidence-first supervisory analytics for SOC assessment"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
lint.ignore = ["B008"] # FastAPI uses Depends, File, Form, and Query in parameter defaults.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
