services:
  app:
    image: ${APP_IMAGE:-sat-sa:mvp}
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${HOST_PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: sqlite:////data/sat-sa.db
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-11534336}
      MAX_RECORDS_PER_SUBMISSION: ${MAX_RECORDS_PER_SUBMISSION:-10000}
      DEMO_ENABLED: ${DEMO_ENABLED:-true}
    volumes:
      - sat_sa_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  sat_sa_data:
